[project]
name = "intro-to-prefect"
description = "An introductory project to Prefect"
version = "0.1.0"
requires-python = ">=3.12"
authors = [
    { name = "Ganesh Lokhande", email = "lokhandeganesh8@gmail.com" }
]
dependencies = [
    "prefect",
    "httpx",
    "psycopg2-binary",
    "python-json-logger>=4.2.0",
    "prefect-sqlalchemy>=0.6.1",
    "pyodbc>=5.3.0",
    "prefect-dask>=0.3.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "psutil",
    "pytest-env",
    "pre-commit"

]

[project.scripts]
pipeline = "pipeline.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"

[dependency-groups]
dev = [
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "ruff>=0.16.7",
]
